#Definimos contenedores de la aplicacion
services:
  # Servicio de base de datos
  moviedux-db:
    build: ./database
    container_name: moviedux-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "MovieDux@2024"
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'MovieDux@2024' -d MovieDux -C -Q 'SELECT 1' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # Servicio del backend y se construye la imagen desde el Dockerfile
  moviedux-backend:
    build: ./backend
    container_name: moviedux-backend
    environment:
      DB_USER: sa
      DB_PASSWORD: "MovieDux@2024"
      DB_SERVER: moviedux-db
      DB_DATABASE: MovieDux
      DB_PORT: 1433
      PORT: 5000
    ports:
      - "5000:5000"
    networks:
      - app_network
    depends_on:
      moviedux-db:
        condition: service_healthy
# Definimos la red personalizada como bridge
networks:
  app_network:
    driver: bridge
